name: Collect Warm Market Assortment

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: collector-warm
  cancel-in-progress: false

jobs:
  collect-warm:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Warm Items Collector
        env:
          STALCRAFT_CLIENT_ID: ${{ secrets.STALCRAFT_CLIENT_ID }}
          STALCRAFT_CLIENT_SECRET: ${{ secrets.STALCRAFT_CLIENT_SECRET }}
          STALCRAFT_REGION: ${{ vars.STALCRAFT_REGION || 'RU' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python collector/runner.py --tier warm
