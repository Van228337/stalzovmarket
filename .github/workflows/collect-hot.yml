name: Collect Hot Market Lots & Signals

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: collector-hot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect-hot:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Hot Items Collector & Signal Generation
        env:
          STALCRAFT_CLIENT_ID: ${{ secrets.STALCRAFT_CLIENT_ID }}
          STALCRAFT_CLIENT_SECRET: ${{ secrets.STALCRAFT_CLIENT_SECRET }}
          STALCRAFT_REGION: ${{ vars.STALCRAFT_REGION || 'RU' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python collector/runner.py --tier hot

      - name: Commit updated digest for GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/digest.json data/digest.json docs/market_analytics.json data/market_analytics.json docs/prompt_for_external_llm.txt data/prompt_for_external_llm.txt || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update market digest [skip ci]" && git push)

