name: Keep-Alive Scheduled Workflows

on:
  schedule:
    # Run on 1st day of every month to prevent GitHub from disabling scheduled cron jobs
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Keepalive Touch
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "chore(ci): monthly keepalive touch to maintain scheduled workflows [skip ci]" || exit 0
          git push
