name: Sync Items Catalog

on:
  schedule:
    # Run once daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync Catalog & Export catalog.json
        run: |
          python -c "import asyncio; from collector.items_db import ItemsDatabase; db = ItemsDatabase(); asyncio.run(db.load_catalog(force_refresh=True, export_web_catalog=True))"

      - name: Commit Updated web/catalog.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/catalog.json
          git commit -m "chore(catalog): update web/catalog.json from EXBO database [skip ci]" || echo "No catalog changes"
          git push || echo "No push needed"
